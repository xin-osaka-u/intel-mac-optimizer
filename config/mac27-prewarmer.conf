# mac27-prewarmer configuration. After editing, run: ~/.local/bin/mac27-prewarmer --full
# (otherwise the change is picked up by the next scheduled run).
#
# include <directory>  also scan this directory (dyld cache, /Applications and /System/Applications are always scanned)
# exclude <text>       skip every file or folder whose path contains this text
#
# Only x86_64 Mach-O code, UI resources (.car .pak .metallib .nib .bin .dat) and fonts (.ttf .ttc .otf) are warmed.

include /Library/Developer/CommandLineTools
include /usr/local/Cellar
include /System/Library/Fonts
include ~/Library/Application Support/Claude/claude-code

exclude /Affinity Photo 2.app/
exclude /Digital Photo Professional 4.app/
exclude /Keynote.app/
exclude /Pages.app/
exclude /Numbers.app/
